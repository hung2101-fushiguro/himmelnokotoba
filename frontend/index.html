<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Himmel no Kotoba</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <svg class="header-icon" width="24" height="24" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <!-- blade -->
      <line x1="12" y1="2" x2="12" y2="14"/>
      <!-- guard -->
      <line x1="8" y1="14" x2="16" y2="14"/>
      <!-- grip -->
      <line x1="12" y1="14" x2="12" y2="18"/>
      <!-- pommel -->
      <circle cx="12" cy="19.5" r="1.5"/>
    </svg>
    <h1>Himmel no Kotoba</h1>
  </header>

  <main class="chat-container">
    <div class="chat-messages" id="chatMessages">
      <div class="welcome-message">
        <p>Xin chào! Mình là gia sư tiếng Nhật. Hãy nhập câu hỏi bất kỳ bằng Kanji, Hiragana, Katakana, Romaji hoặc tiếng Việt nhé.</p>
      </div>
    </div>
  </main>

  <footer class="input-area">
    <input
      type="text"
      id="userInput"
      class="chat-input"
      placeholder="Nhập câu hỏi tiếng Nhật..."
      autocomplete="off"
    >
    <button id="sendBtn" class="btn-send" title="Gửi">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
    <button id="clearBtn" class="btn-clear" title="Xóa lịch sử">Xóa lịch sử</button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
